name: CD

on:
  push:
    tags:
      # v 開頭的標籤：只發 release，不構建 docker（如 v3.11.3）
      - 'v*'
      # 純數字版本號：發 release + 構建 docker（如 3.12）
      - '[0-9]+.[0-9]+'
  workflow_dispatch:  # 手工运行：在 Actions 页选该 workflow，点 "Run workflow"，选分支并填版本号（如 3.34.0）
    inputs:
      version:
        description: '版本号（仅手工运行时用，如 3.34.0）'
        required: true
        default: ''

env:
  GO_VERSION: '1.25.4'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 僅構建 Linux amd64 Release 資產
  build:
    name: Build (linux-amd64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: get_version
      run: |
        # 手工运行时用输入的版本号，否则从 tag 解析
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        
    - name: Build frontend (for go:embed)
      run: |
        mkdir -p web/dist
        if [ -d "webui" ]; then
          cd webui
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm run build
            cd ..
            if [ -d "webui/dist" ] && [ "$(ls -A webui/dist 2>/dev/null)" ]; then
              cp -r webui/dist/* web/dist/ || true
            fi
          else
            cd ..
          fi
        fi
        # 确保 dist 目录至少有一个文件，避免 go:embed 报错
        if [ ! "$(ls -A web/dist 2>/dev/null)" ]; then
          echo "# Placeholder" > web/dist/.gitkeep
        fi
        
    - name: Install C compiler and SQLite dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev
        
    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        # 驗證 CGO 狀態
        echo "CGO_ENABLED=${CGO_ENABLED}"
        go env CGO_ENABLED
        
        # 临时移动工具文件，避免 main 函数冲突
        mkdir -p .tools_backup
        for file in analyze_market_data.go run_1m_backtest.go run_3m_backtest.go run_eth_backtest.go test_intrabar_backtest.go test_intrabar_quick.go test_license_validation.go test_plugin_detailed.go test_plugin_loading.go test_zero_fee.go; do
          if [ -f "$file" ]; then
            mv "$file" .tools_backup/ || true
          fi
        done
        
        # 构建
        VERSION=${{ steps.get_version.outputs.version }}
        echo "Building version ${VERSION} for ${{ matrix.goos }}/${{ matrix.goarch }} with CGO_ENABLED=1"
        go build -ldflags="-s -w -X main.Version=${VERSION}" -o quantmesh-${{ matrix.goos }}-${{ matrix.goarch }} .
        
        # 恢复工具文件
        if [ -d ".tools_backup" ]; then
          mv .tools_backup/* . 2>/dev/null || true
          rmdir .tools_backup 2>/dev/null || true
        fi
        
    - name: Create archive
      run: |
        set -e  # 遇到错误立即退出
        VERSION=${{ steps.get_version.outputs.version }}
        ARCHIVE_DIR="quantmesh-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
        
        echo "=== Creating archive for ${ARCHIVE_DIR} ==="
        
        # 创建打包目录
        mkdir -p "${ARCHIVE_DIR}"
        
        # 复制二进制文件
        echo "Copying binary..."
        cp "quantmesh-${{ matrix.goos }}-${{ matrix.goarch }}" "${ARCHIVE_DIR}/"
        
        # 复制配置和文档
        echo "Copying config and docs..."
        cp config.example.yaml "${ARCHIVE_DIR}/"
        cp README.md "${ARCHIVE_DIR}/"
        cp LICENSE "${ARCHIVE_DIR}/"
        
        # 复制安装脚本和 systemd 服务文件（仅 Linux）
        if [ "${{ matrix.goos }}" = "linux" ]; then
          echo "Copying Linux scripts..."
          cp scripts/install.sh "${ARCHIVE_DIR}/"
          cp scripts/quantmesh.service "${ARCHIVE_DIR}/"
          chmod +x "${ARCHIVE_DIR}/install.sh"
          
          # 复制辅助脚本（如果存在）
          [ -f scripts/backup.sh ] && cp scripts/backup.sh "${ARCHIVE_DIR}/"
          [ -f scripts/restore.sh ] && cp scripts/restore.sh "${ARCHIVE_DIR}/"
        fi
        
        # 显示目录内容
        echo "=== Archive directory contents ==="
        ls -la "${ARCHIVE_DIR}/"
        
        # 创建压缩包
        echo "Creating tar.gz..."
        tar -czf "quantmesh-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "${ARCHIVE_DIR}"
        
        # 验证压缩包内容
        echo "=== Verifying archive contents ==="
        tar -tzf "quantmesh-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: quantmesh-${{ matrix.goos }}-${{ matrix.goarch }}
        path: ./quantmesh-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        retention-days: 1

  # 创建 Release 并上传所有资产
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_stable: ${{ steps.check_tag.outputs.is_stable }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Get version
      id: get_version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        
    - name: Set release tag name
      id: release_tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          echo "tag=v${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi
        
    - name: Check tag type
      id: check_tag
      run: |
        TAG="${{ steps.release_tag.outputs.tag }}"
        # 检查是否是纯数字版本（如 3.12），不以 v 开头
        if [[ "$TAG" =~ ^[0-9]+\.[0-9]+$ ]]; then
          echo "is_stable=true" >> $GITHUB_OUTPUT
          echo "Tag $TAG is a stable release, will build Docker image"
        else
          echo "is_stable=false" >> $GITHUB_OUTPUT
          echo "Tag $TAG is a dev release, skip Docker image"
        fi
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Prepare release files
      run: |
        mkdir -p release-files
        find artifacts -name "*.tar.gz" -exec cp {} release-files/ \;
        ls -la release-files/
        
    - name: Generate changelog
      id: changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_tag.outputs.tag }}
        name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.changelog }}
          
          ## Installation
          
          ### Linux (amd64) - 自動安裝
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}/quantmesh-${{ steps.get_version.outputs.version }}-linux-amd64.tar.gz
          tar -xzf quantmesh-${{ steps.get_version.outputs.version }}-linux-amd64.tar.gz
          cd quantmesh-${{ steps.get_version.outputs.version }}-linux-amd64
          sudo ./install.sh
          ```
          
          ### Linux (amd64) - 手動安裝
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}/quantmesh-${{ steps.get_version.outputs.version }}-linux-amd64.tar.gz
          tar -xzf quantmesh-${{ steps.get_version.outputs.version }}-linux-amd64.tar.gz
          chmod +x quantmesh-linux-amd64
          sudo mv quantmesh-linux-amd64 /usr/local/bin/quantmesh
          ```
          
          ### Docker (GitHub Container Registry)
          ```bash
          # 拉取镜像
          docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
          
          # 运行容器
          docker run -d \
            --name quantmesh \
            -p 28888:28888 \
            -v $(pwd)/config.yaml:/app/config.yaml \
            -v $(pwd)/data:/app/data \
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
          ```
          
          或者使用 Docker Compose:
          ```yaml
          version: '3.8'
          services:
            quantmesh:
              image: ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
              container_name: quantmesh
              restart: unless-stopped
              ports:
                - "28888:28888"
              volumes:
                - ./config.yaml:/app/config.yaml:ro
                - ./data:/app/data
          ```
        draft: false
        prerelease: false
        generate_release_notes: false
        files: release-files/*

  # 构建并推送 Docker 镜像到 GitHub Container Registry
  # 只有纯数字版本标签（如 3.12）才触发
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.is_stable == 'true'
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: get_version
      run: echo "version=${{ needs.release.outputs.version }}" >> $GITHUB_OUTPUT
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ needs.release.outputs.version }}
          type=raw,value=latest
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ needs.release.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
