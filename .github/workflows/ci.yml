name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # 在 Actions 页点击 "Run workflow" 可手工运行

env:
  GO_VERSION: '1.25.4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      QUANTMESH_MYSQL_TEST_DSN: root@tcp(127.0.0.1:3306)/quantmesh_test?parseTime=true
      QUANTMESH_MYSQL_TEST_ALLOW_DESTRUCTIVE_SCHEMA: '1'
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: quantmesh_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=24

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Enable Corepack (Yarn 4)
      run: corepack enable

    - name: Prepare Yarn (with retry)
      run: |
        for i in 1 2 3; do
          if corepack prepare yarn@4.12.0 --activate; then
            echo "Yarn prepared successfully"
            break
          fi
          echo "Attempt $i failed, retrying in 5 seconds..."
          sleep 5
        done

    - name: Install C compiler and SQLite dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev ruby ruby-minitest

    - name: Run frontend tests
      working-directory: webui
      run: |
        yarn install --immutable
        yarn verify

    - name: Prepare embedded frontend for Go tests
      run: ruby scripts/frontend_embed.rb sync

    - name: Run Go tests
      run: |
        ruby scripts/frontend_embed.rb verify
        go test -tags embedded_frontend ./web -run '^TestEmbeddedFrontendProvenance$' -count=1
        go test ./... -coverprofile=/tmp/quantmesh-go-cover.out

    - name: Run Go static analysis
      run: go vet ./...

    - name: Verify trading race gate contract
      run: |
        ruby scripts/tests/trading_race_gate_test.rb
        ruby scripts/tests/frontend_embed_test.rb
        ruby scripts/tests/profit_readiness_timeout_test.rb

    - name: Race-test trading risk core
      run: ruby scripts/verify_trading_race.rb /tmp/quantmesh-trading-race --require-mysql

    - name: Upload trading race evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trading-race-evidence-${{ github.sha }}
        path: /tmp/quantmesh-trading-race/

    - name: Report Go coverage
      run: go tool cover -func=/tmp/quantmesh-go-cover.out | tail -n 1

  # 构建
  build:
    name: Build
    runs-on: ${{ matrix.runner }}
    needs: test
    
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            name: linux-amd64
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Enable Corepack (Yarn 4)
      run: corepack enable

    - name: Prepare Yarn (with retry)
      run: |
        # 预先准备 yarn，带重试机制
        for i in 1 2 3; do
          if corepack prepare yarn@4.12.0 --activate; then
            echo "Yarn prepared successfully"
            break
          fi
          echo "Attempt $i failed, retrying in 5 seconds..."
          sleep 5
        done

    - name: Install Ruby frontend gate
      run: sudo apt-get update && sudo apt-get install -y ruby

    - name: Build frontend (for go:embed)
      run: |
        yarn --cwd webui install --immutable
        yarn --cwd webui build
        ruby scripts/frontend_embed.rb sync
        ruby scripts/frontend_embed.rb verify
        
    - name: Install C compiler and SQLite dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev
        
    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 1
      run: |
        # 临时移动工具文件，避免 main 函数冲突
        mkdir -p .tools_backup
        for file in analyze_market_data.go run_1m_backtest.go run_3m_backtest.go run_eth_backtest.go test_intrabar_backtest.go test_intrabar_quick.go test_license_validation.go test_plugin_detailed.go test_plugin_loading.go test_zero_fee.go; do
          if [ -f "$file" ]; then
            mv "$file" .tools_backup/ || true
          fi
        done
        
        # 构建
        ruby scripts/frontend_embed.rb verify
        VERSION=$(node -p "require('./webui/package.json').version")
        BACKEND_VERSION=$(sed -n 's/^var Version = "\(.*\)"/\1/p' main.go)
        test -n "$VERSION" && test "$VERSION" = "$BACKEND_VERSION"
        go build -ldflags="-s -w -X main.Version=${VERSION}" -o quantmesh-${{ matrix.name }} .
        
        # 恢复工具文件
        if [ -d ".tools_backup" ]; then
          mv .tools_backup/* . 2>/dev/null || true
          rmdir .tools_backup 2>/dev/null || true
        fi
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: quantmesh-${{ matrix.name }}
        path: quantmesh-${{ matrix.name }}
        retention-days: 7
