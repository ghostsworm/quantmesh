# QuantMesh 波动率暂停开仓配置示例
# 展示如何配置不同交易对的波动率检测和自动暂停开仓功能

# ========== BTC 网格策略配置 ==========
bot_name: "BTC网格-智能波动保护"

trading:
  exchange: "binance_spot"
  symbol: "BTCUSDT"

  # ========== 动态调整 ==========
  dynamic_adjustment:
    enabled: true

    # 波动率区间检测（使用 BTC 预设）
    volatility_detection:
      enabled: true  # 启用后自动使用 BTC 内置预设
      # BTC 预设: 低<1.5%, 正常<4.0%, 高<7.0%, 极端≥15.0%
      # 如果想自定义，可以覆盖预设值：
      # low_threshold: 1.5
      # normal_threshold: 4.0
      # high_threshold: 7.0
      # extreme_threshold: 15.0

  # ========== 网格策略参数 ==========
  upper_price: 50000
  lower_price: 40000
  grid_count: 20
  order_quantity: 100
  price_interval: 500

  # ========== 开仓管理（含波动率暂停）==========
  open_position_control:
    # Bot 独立风控配置
    bot_risk_control:
      enabled: true

      # ========== 波动率暂停开仓配置 ==========
      volatility_pause_enabled: true  # 启用波动率暂停开仓

      volatility_pause_config:
        # 基本暂停条件
        pause_on_high_volatility: true     # 高波动时暂停开仓（推荐）
        pause_on_extreme_volatility: true  # 极端波动时暂停开仓（强烈推荐）
        pause_on_sudden_increase: true     # 波动率突然增加时暂停开仓（推荐）

        # 策略方向过滤（根据策略和行情组合判断）
        pause_on_downtrend: true   # 做多策略在高波动下跌行情中暂停开仓
        pause_on_uptrend: false    # 做空策略在高波动上涨行情中暂停开仓（本策略是做多）

        # 自动恢复
        auto_resume_on_normal: true  # 波动率回归正常时自动恢复开仓
        resume_threshold: 2.0        # 低于此波动率时恢复开仓（%）

        # 趋势判断配置
        trend_check_period: 15       # 趋势检查周期（分钟）
        trend_down_threshold: 2.0    # 下跌趋势阈值（%）
        trend_up_threshold: 2.0      # 上涨趋势阈值（%）

