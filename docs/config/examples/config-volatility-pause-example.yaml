# ========== ========== ========== ==========
# 使用场景说明
# ========== ========== ========== ==========

# 场景 1: 做多网格（常规）
# - 配置: pause_on_downtrend: true, pause_on_uptrend: false
# - 效果: 下跌行情中暂停开仓，避免"接飞刀"
# - 适用: BTC/ETH 做多网格

# 场景 2: 做空网格
# - 配置: pause_on_downtrend: false, pause_on_uptrend: true
# - 效果: 上涨行情中暂停开仓，避免逆势加仓
# - 适用: 期货做空网格

# 场景 3: 稳定币套利
# - 配置: 使用稳定币预设（极低阈值）
# - 效果: 在异常波动时及时保护
# - 适用: USDT/BUSD 等稳定币对

# 场景 4: Meme 币交易
# - 配置: 启用所有保护机制
# - 效果: 极端波动时立即暂停，避免大幅亏损
# - 适用: DOGE/SHIB 等高波动品种

